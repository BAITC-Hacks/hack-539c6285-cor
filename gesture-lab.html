<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qyran — лаборатория жестов</title>
    <style>
      html, body { margin: 0; height: 100%; background: #20262a; color: #e8e4da; font: 13px/1.4 system-ui, sans-serif; }
      #view { position: fixed; inset: 0 0 56px 0; }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; display: flex; gap: 12px; align-items: center; padding: 0 16px; background: #14191c; }
      #bar input[type=range] { flex: 1; }
      .lbl { position: fixed; padding: 2px 8px; background: rgba(0,0,0,.45); border-radius: 4px; pointer-events: none; }
      button, select { background: #2c3439; color: inherit; border: 1px solid #3d474d; border-radius: 6px; padding: 6px 10px; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="bar">
      <button id="play">▶</button>
      <input id="time" type="range" min="0" max="1" step="0.01" value="0" />
      <span id="tlabel">t = 0.00 с</span>
      <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option></select>
    </div>
    <script type="module" src="/src/lab/gestureLab.ts"></script>
  </body>
</html>
