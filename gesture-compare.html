<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qyran — сверка жеста с записью</title>
    <style>
      html, body { margin: 0; background: #1b1f22; color: #e8e4da; font: 13px/1.4 system-ui, sans-serif; }
      #grid { display: grid; gap: 6px; padding: 6px; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: #000; position: relative; }
      .cell { position: relative; overflow: hidden; aspect-ratio: var(--ar, 4 / 3); background: #000; }
      .cell canvas { width: 100%; height: 100%; display: block; }
      .tag { position: absolute; left: 4px; top: 4px; padding: 1px 6px; background: rgba(0, 0, 0, .6); color: #ff0; font-weight: 700; border-radius: 3px; z-index: 2; }
      .who { position: absolute; right: 4px; bottom: 4px; padding: 1px 6px; background: rgba(0, 0, 0, .5); color: #ddd; border-radius: 3px; z-index: 2; font-size: 11px; }
      #bar { display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: #111; }
      #bar input[type=range] { flex: 1; }
      button, select { background: #2c3439; color: inherit; border: 1px solid #3d474d; border-radius: 6px; padding: 5px 10px; }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="play">▶</button>
      <input id="time" type="range" min="0" max="1" step="0.01" value="0" />
      <span id="tlabel"></span>
      <select id="speed"><option>0.25</option><option selected>0.5</option><option>1</option></select>
    </div>
    <div id="grid"></div>
    <script type="module" src="/src/lab/gestureCompare.ts"></script>
  </body>
</html>
